services:
  web:
    build: .
    image: buoybay-site:local
    ports:
      - "127.0.0.1:${BUOYBAY_HTTP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SOURCE_URL: "${BUOYBAY_SOURCE_URL:-https://github.com/BuoyBay/buoybay.net}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
